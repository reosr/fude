name: Fude CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fude-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The app uses browser-side ONNX Runtime; CI does not need the Linux CUDA provider.
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Lint changed feature files
        run: >-
          npx eslint
          app/irodori/page.tsx
          app/irodori/starter/page.tsx
          app/irodori/starter/lesson-1/page.tsx
          app/irodori/starter/lesson-2/page.tsx
          app/irodori/starter/lesson-3/page.tsx
          app/irodori/starter/lesson-4/page.tsx
          components/IrodoriConversation.tsx
          lib/irodori-progress.ts
          lib/irodori-speakers.ts
          app/gacha/page.tsx
          app/profil/page.tsx
          components/BottomNav.tsx
          components/GachaBadgeArtwork.tsx
          components/KanaStroke.tsx
          components/JLPTQuiz.tsx
          components/ProfileAvatar.tsx
          components/ProfilePicture.tsx
          components/Sidebar.tsx
          data/gacha-badges.ts
          lib/gacha.ts
          lib/gamification.ts
          lib/profile-collections.ts

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build production app
        run: npm run build
