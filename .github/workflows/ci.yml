name: Fude CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fude-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed feature files
        run: >-
          npx eslint
          app/gacha/page.tsx
          app/profil/page.tsx
          components/BottomNav.tsx
          components/ProfileAvatar.tsx
          components/Sidebar.tsx
          data/gacha-badges.ts
          lib/gacha.ts
          lib/gamification.ts
          lib/profile-collections.ts

      - name: Build production app
        run: npm run build
